<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.15)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>
  <circle cx="150" cy="80" r="220" fill="rgba(255, 255, 255, 0.03)"/>
  <circle cx="1050" cy="320" r="280" fill="rgba(255, 255, 255, 0.04)"/>

  <!-- Logo and Title -->
  <g transform="translate(80, 130)">
    <!-- Cross/Medical Icon -->
    <rect x="0" y="25" width="50" height="15" rx="7.5" fill="#38bdf8"/>
    <rect x="17.5" y="7.5" width="15" height="50" rx="7.5" fill="#38bdf8"/>
    
    <text x="75" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">Helpa</text>
    <text x="75" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#93c5fd">WhatsApp AI Receptionist &amp; Clinic CRM</text>
    
    <rect x="75" y="115" width="340" height="36" rx="18" fill="rgba(255, 255, 255, 0.12)"/>
    <text x="95" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e0f2fe">⚡ 24/7 Patient Bookings • Signed OPD Slips</text>
  </g>

  <!-- Right Visual Feature Card -->
  <g transform="translate(680, 60)">
    <rect width="440" height="280" rx="16" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
    
    <!-- Chat Header -->
    <rect x="20" y="20" width="400" height="48" rx="8" fill="rgba(15, 23, 42, 0.6)"/>
    <circle cx="44" cy="44" r="14" fill="#10b981"/>
    <text x="70" y="49" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">Apollo Clinic AI Assistant</text>
    
    <!-- Chat Bubbles -->
    <rect x="20" y="85" width="280" height="50" rx="12" fill="rgba(255, 255, 255, 0.1)"/>
    <text x="35" y="114" font-family="sans-serif" font-size="13" fill="#e2e8f0">Hello! Need Dr. Sharma OPD ticket.</text>
    
    <rect x="140" y="150" width="280" height="60" rx="12" fill="#0284c7"/>
    <text x="155" y="174" font-family="sans-serif" font-size="13" font-weight="600" fill="#ffffff">Appointment confirmed! 📅</text>
    <text x="155" y="195" font-family="sans-serif" font-size="12" fill="#bae6fd">OPD Slip PAT-09325 ready to download.</text>

    <!-- OPD Badge -->
    <rect x="20" y="225" width="400" height="35" rx="8" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1"/>
    <text x="35" y="247" font-family="sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">🔒 HMAC Token Signed • Verified Patient Isolation</text>
  </g>
</svg>
