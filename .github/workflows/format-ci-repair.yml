name: Format CI repair branch

on:
  push:
    branches:
      - fix/ci-baseline-ai-tests-20260827

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format affected files
        run: |
          npx prettier --write \
            "src/app/(dashboard)/trip-proposals/page.tsx" \
            "src/tests/ai-provider-architecture.test.ts" \
            "src/tests/ai/super-admin-routing.test.ts" \
            "src/tests/core-ai.test.ts"
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "chore: format CI repair files"
          git push
