name: Post-Deployment Production Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-production:
    name: Verify Live Production Site & Deployed Commit SHA
    runs-on: ubuntu-latest
    env:
      PRODUCTION_URL: https://www.helpa.studio
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Production Homepage (HTTP 200)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PRODUCTION_URL/")
          echo "Homepage HTTP status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Error: Homepage returned $STATUS instead of 200"
            exit 1
          fi

      - name: Verify Production /login (HTTP 200)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PRODUCTION_URL/login")
          echo "Login page HTTP status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Error: /login returned $STATUS instead of 200"
            exit 1
          fi

      - name: Verify Live Deployed Commit SHA via /api/health
        run: |
          node scripts/verify-deployment.mjs
