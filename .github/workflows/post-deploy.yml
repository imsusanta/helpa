name: Post-Deployment Production Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-production:
    name: Verify Live Production Site & Deployed Commit SHA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_URL: https://www.helpa.studio
      EXPECTED_SHA: ${{ github.sha }}
      EVIDENCE_DIR: artifacts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Live Deployed Commit SHA and Site Health
        run: |
          node scripts/verify-deployment.mjs

      - name: Upload Deployment Verification Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-verification-report
          path: artifacts/
          retention-days: 7
