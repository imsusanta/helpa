name: Diagnose PR 112 quality

on:
  push:
    branches:
      - feat/complete-existing-ui-features
    paths:
      - .github/workflows/diagnose-pr112-quality.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-existing-ui-features
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture quality output
        shell: bash
        run: |
          set +e
          {
            echo '=== FORMAT ==='
            npm run format:check
            echo "FORMAT_EXIT=$?"
            echo '=== LINT ==='
            npm run lint
            echo "LINT_EXIT=$?"
            echo '=== TYPECHECK ==='
            npm run typecheck
            echo "TYPECHECK_EXIT=$?"
          } > pr112-quality.log 2>&1
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr112-quality.log
          git commit -m "ci: record final PR 112 quality diagnostics"
          git push origin HEAD:feat/complete-existing-ui-features
