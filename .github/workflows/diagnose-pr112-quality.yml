name: Format PR 112 files

on:
  push:
    branches:
      - feat/complete-existing-ui-features
    paths:
      - .github/workflows/diagnose-pr112-quality.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-existing-ui-features
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format diagnosed files
        run: |
          npx prettier --write \
            src/components/automation-ai/ai-assistant-console.tsx \
            src/components/automation-ai/chatbot-console.tsx \
            src/components/automation-ai/faq-bot-console.tsx \
            src/components/layout/sidebar.tsx \
            src/tests/whatsapp/webhook-idempotency.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/automation-ai/ai-assistant-console.tsx \
            src/components/automation-ai/chatbot-console.tsx \
            src/components/automation-ai/faq-bot-console.tsx \
            src/components/layout/sidebar.tsx \
            src/tests/whatsapp/webhook-idempotency.test.ts
          git commit -m "style: format remaining PR files"
          git push origin HEAD:feat/complete-existing-ui-features
