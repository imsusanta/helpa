name: Diagnose product-readiness branch

on:
  push:
    branches: [improve/product-readiness-9]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/product-readiness-9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Capture npm diagnostics
        shell: bash
        run: |
          mkdir -p diagnostics/ci
          set +e
          npm ci > diagnostics/ci/npm-ci.log 2>&1
          npm ci --package-lock-only --ignore-scripts > diagnostics/ci/npm-lock.log 2>&1
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/ci
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: capture npm CI diagnostics"
          git push origin HEAD:improve/product-readiness-9
