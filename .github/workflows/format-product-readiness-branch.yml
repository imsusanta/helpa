name: Repair product-readiness branch

on:
  push:
    branches: [improve/product-readiness-9]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/product-readiness-9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format and collect diagnostics
        shell: bash
        run: |
          mkdir -p diagnostics/ci
          set +e
          npm run format > diagnostics/ci/format.log 2>&1
          npm run format:check > diagnostics/ci/format-check.log 2>&1
          npm run lint > diagnostics/ci/lint.log 2>&1
          npm run typecheck > diagnostics/ci/typecheck.log 2>&1
          npm test > diagnostics/ci/tests.log 2>&1
          npm audit --audit-level=high > diagnostics/ci/audit.log 2>&1
          exit 0
      - name: Commit formatting and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: apply formatting and capture CI diagnostics"
          git push origin HEAD:improve/product-readiness-9
