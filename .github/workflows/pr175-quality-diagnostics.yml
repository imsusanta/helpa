name: PR 175 targeted formatter

on:
  push:
    branches:
      - fix/whatsapp-security-reliability-audit-20260827

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format failing file
        run: npx prettier --write src/tests/whatsapp/embedded-signup.test.ts
      - name: Commit formatted file
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tests/whatsapp/embedded-signup.test.ts
          git commit -m 'style: format WhatsApp embedded signup test'
          git push
