name: PR 175 quality diagnostics

on:
  push:
    branches:
      - fix/whatsapp-security-reliability-audit-20260827

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Capture quality output
        shell: bash
        run: |
          set +e
          {
            echo '=== FORMAT ==='
            npm run format:check
            echo '=== LINT ==='
            npm run lint
            echo '=== TYPES ==='
            npm run typecheck
          } > .github/pr175-quality-diagnostics.log 2>&1
          exit 0
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/pr175-quality-diagnostics.log
          git commit -m 'chore: capture PR 175 quality diagnostics'
          git push
