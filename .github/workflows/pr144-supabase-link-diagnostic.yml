name: PR 142 Supabase link diagnostic

on:
  push:
    branches: [fix/pr142-quality-gate]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose-staging-link:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      MIGRATION_TARGET: ${{ secrets.MIGRATION_TARGET }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - id: link
        name: Diagnose staging link without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$MIGRATION_TARGET" = "staging"
          set +e
          output=$(supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" 2>&1)
          status=$?
          set -e
          reason="success"
          if [ "$status" -ne 0 ]; then
            reason="unclassified link failure"
            if grep -Eqi 'invalid access token|unauthorized|forbidden|status 401|status 403' <<< "$output"; then
              reason="Supabase access token was rejected"
            elif grep -Eqi 'project.*not found|cannot find project|failed to retrieve project' <<< "$output"; then
              reason="project reference is missing or inaccessible to this token"
            elif grep -Eqi 'password authentication failed|authentication failed|invalid password|SASL' <<< "$output"; then
              reason="staging database password was rejected"
            elif grep -Eqi 'tenant or user not found' <<< "$output"; then
              reason="project reference and database credentials do not identify the same staging project"
            elif grep -Eqi 'timeout|timed out|connection refused|failed to connect|network' <<< "$output"; then
              reason="staging database connection failed"
            fi
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
      - name: Publish sanitized diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
          LINK_STATUS: ${{ steps.link.outputs.status }}
          LINK_REASON: ${{ steps.link.outputs.reason }}
        shell: bash
        run: |
          if [ "$LINK_STATUS" = "0" ]; then result="passed"; else result="failed"; fi
          cat > /tmp/comment.md <<EOF
          ## Supabase staging link diagnosis

          - Link result: **${result}**
          - Diagnosis: **${LINK_REASON}**
          - Migration executed: **no**

          No secret values are included in this report.
          EOF
          gh pr comment 144 --body-file /tmp/comment.md
          test "$LINK_STATUS" = "0"
