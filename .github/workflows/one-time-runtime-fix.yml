name: One-time runtime and quality fix

on:
  push:
    branches:
      - fix/ci-errors-post-merge

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/ci-errors-post-merge
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add Node.js WebSocket transport
        run: |
          npm install ws
          npm install --save-dev @types/ws

      - name: Apply targeted code-quality fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          admin = Path('src/lib/supabase/typed-admin.ts')
          text = admin.read_text()
          text = text.replace(
              "import { createClient, type SupabaseClient } from '@supabase/supabase-js';\n",
              "import { createClient, type SupabaseClient } from '@supabase/supabase-js';\nimport WebSocket from 'ws';\n",
          )
          text = text.replace(
              "      auth: {\n        persistSession: false,\n        autoRefreshToken: false,\n      },\n",
              "      auth: {\n        persistSession: false,\n        autoRefreshToken: false,\n      },\n      realtime: {\n        transport: WebSocket,\n      },\n",
          )
          admin.write_text(text)

          appointments = Path('src/app/(dashboard)/appointments/page.tsx')
          text = appointments.read_text()
          for item in ['  Check,\n', '  Building,\n', '  ShieldCheck,\n']:
              text = text.replace(item, '')
          text = text.replace(
              "import { DEFAULT_BOOKING_FORM_CONFIG } from '@/lib/booking-form/config';\n",
              "import { DEFAULT_BOOKING_FORM_CONFIG } from '@/lib/booking-form/config';\n\nfunction getErrorMessage(error: unknown): string {\n  return error instanceof Error ? error.message : 'Unknown error';\n}\n",
          )
          for item in [
              "  const [showEditForm, setShowEditForm] = useState(false);\n",
              "  const [editingApptId, setEditingApptId] = useState<string | null>(null);\n",
              "  const [appointmentType, setAppointmentType] = useState('');\n",
              "  const [reasonForVisit, setReasonForVisit] = useState('');\n",
              "    setAppointmentType('');\n",
              "    setReasonForVisit('');\n",
              "            setShowEditForm(false);\n",
          ]:
              text = text.replace(item, '')
          text = text.replace(
              '      setAppointments((appts as any) || []);',
              '      setAppointments((appts ?? []) as unknown as Appointment[]);',
          )
          text = text.replace(
              "    } catch (err: any) {\n      toast.error('Failed to book appointment: ' + err.message);",
              "    } catch (err: unknown) {\n      toast.error('Failed to book appointment: ' + getErrorMessage(err));",
          )
          text = text.replace(
              "    } catch (err: any) {\n      toast.error('Status update failed: ' + err.message);",
              "    } catch (err: unknown) {\n      toast.error('Status update failed: ' + getErrorMessage(err));",
          )
          text = text.replace(
              "                          } catch (e: any) {\n                            toast.error(\n                              'Error sending ticket PDF: ' + e.message\n                            );",
              "                          } catch (error: unknown) {\n                            toast.error(\n                              'Error sending ticket PDF: ' +\n                                getErrorMessage(error)\n                            );",
          )
          appointments.write_text(text)
          PY

      - name: Format changes
        run: |
          npm run format
          npm run format:check

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: support Node 20 tests and remove appointment warnings"
          git push origin HEAD:fix/ci-errors-post-merge
