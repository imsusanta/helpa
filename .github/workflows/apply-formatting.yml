name: Apply repository formatting

on:
  push:
    branches:
      - feat/complete-existing-ui-features
    paths:
      - .github/workflows/apply-formatting.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/complete-existing-ui-features

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format affected file
        run: npx prettier --write src/types/index.ts

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/index.ts
          git commit -m "style: format upstream shared types"
          git push origin HEAD:feat/complete-existing-ui-features
