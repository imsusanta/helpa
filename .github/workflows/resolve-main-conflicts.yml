name: Diagnose refreshed main conflicts

on:
  push:
    branches: [improve/product-readiness-9]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/product-readiness-9
          fetch-depth: 0
      - name: Capture conflict paths
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main > /tmp/merge.log 2>&1
          merge_code=$?
          {
            echo "merge_exit_code=$merge_code"
            cat /tmp/merge.log
            echo
            echo "unmerged_paths:"
            git diff --name-only --diff-filter=U
          } > /tmp/conflicts.txt
          git merge --abort || true
          mkdir -p diagnostics/ci
          cp /tmp/conflicts.txt diagnostics/ci/merge-conflicts.txt
          git add diagnostics/ci/merge-conflicts.txt
          git commit -m "chore: capture refreshed main conflicts"
          git push origin HEAD:improve/product-readiness-9
