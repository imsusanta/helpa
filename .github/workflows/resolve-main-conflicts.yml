name: Resolve refreshed main conflicts

on:
  push:
    branches: [improve/product-readiness-9]

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/product-readiness-9
          fetch-depth: 0
      - name: Merge main and preserve reviewed landing experience
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true
          conflicts="$(git diff --name-only --diff-filter=U)"
          expected=$'src/components/landing/cta-banner.tsx\nsrc/components/landing/faq-section.tsx\nsrc/components/landing/hero.tsx\nsrc/components/landing/industry-solutions.tsx\nsrc/components/landing/navbar.tsx\nsrc/components/landing/pricing-section.tsx\nsrc/components/landing/security-badges.tsx'
          if [ "$conflicts" != "$expected" ]; then
            echo "Unexpected conflict set:"
            printf '%s\n' "$conflicts"
            exit 1
          fi
          while IFS= read -r path; do
            git checkout --ours "$path"
            git add "$path"
          done <<< "$conflicts"
          rm -rf diagnostics/ci
          rm .github/workflows/resolve-main-conflicts.yml
          git add -A
          git commit -m "merge: sync latest main while preserving reviewed landing"
          git push origin HEAD:improve/product-readiness-9
