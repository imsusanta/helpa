name: Resolve latest main conflicts

on:
  push:
    branches: [improve/product-readiness-9]

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/product-readiness-9
          fetch-depth: 0
      - name: Merge latest main with reviewed resolutions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true
          conflicts="$(git diff --name-only --diff-filter=U)"
          expected=$'README.md\nsrc/tests/admin/ai-infrastructure.test.ts'
          if [ "$conflicts" != "$expected" ]; then
            echo "Unexpected conflict set:"
            printf '%s\n' "$conflicts"
            exit 1
          fi
          git checkout --ours README.md
          git checkout --theirs src/tests/admin/ai-infrastructure.test.ts
          git add README.md src/tests/admin/ai-infrastructure.test.ts
          rm -rf diagnostics/ci
          rm .github/workflows/resolve-main-conflicts.yml
          git add -A
          git commit -m "merge: sync latest main and resolve product-readiness conflicts"
          git push origin HEAD:improve/product-readiness-9
