name: PR 130 quality diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  typecheck-report:
    if: github.event.pull_request.number == 130
    name: Quality diagnostic — typecheck report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run typecheck and report errors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          cat /tmp/typecheck.log
          if [ "$status" -ne 0 ]; then
            {
              echo '## PR 130 typecheck diagnostics'
              echo
              echo '```text'
              tail -n 100 /tmp/typecheck.log
              echo '```'
            } > /tmp/typecheck-comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/typecheck-comment.md
          fi
          exit "$status"
