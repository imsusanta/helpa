name: PR quality diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-report:
    if: github.event.pull_request.number == 130 || github.event.pull_request.number == 177
    name: Quality diagnostic report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run quality checks and report errors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          npm run format:check > /tmp/format.log 2>&1
          format_status=$?
          npm run lint > /tmp/lint.log 2>&1
          lint_status=$?
          npm run typecheck > /tmp/typecheck.log 2>&1
          type_status=$?
          cat /tmp/format.log
          cat /tmp/lint.log
          cat /tmp/typecheck.log
          if [ "$format_status" -ne 0 ] || [ "$lint_status" -ne 0 ] || [ "$type_status" -ne 0 ]; then
            {
              echo "## PR $PR_NUMBER quality diagnostics"
              echo
              echo "- format: $format_status"
              echo "- lint: $lint_status"
              echo "- typecheck: $type_status"
              echo
              echo '### Format'
              echo '```text'
              tail -n 80 /tmp/format.log
              echo '```'
              echo '### Lint'
              echo '```text'
              tail -n 120 /tmp/lint.log
              echo '```'
              echo '### Typecheck'
              echo '```text'
              tail -n 120 /tmp/typecheck.log
              echo '```'
            } > /tmp/quality-comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/quality-comment.md
            exit 1
          fi
