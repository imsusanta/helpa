name: Prettier Extract

on:
  push:
    branches: [tmp/prettier-pr69]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: tar -czf /tmp/prettier-files.tgz src/app/api/automations/route.ts src/lib/automations/appointment-triggers.ts
      - uses: actions/upload-artifact@v4
        with:
          name: prettier-files
          path: /tmp/prettier-files.tgz
