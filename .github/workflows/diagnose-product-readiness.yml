name: Repair remaining PR failures

on:
  push:
    branches: [improve/product-readiness-9]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/product-readiness-9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply code-controlled repairs
        run: |
          npm run format
          npm install --save-dev --save-exact @vitest/coverage-v8@4.1.10
          rm -rf diagnostics/ci
          npm run format:check
          npm run lint
          npm run typecheck
          npx vitest run --coverage --exclude='**/src/tests/integration/**'
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src diagnostics/ci
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(ci): format landing page and install coverage provider"
          git push origin HEAD:improve/product-readiness-9
