name: Apply landing formatting repair

on:
  push:
    branches: [improve/product-readiness-9]

permissions:
  contents: write

jobs:
  repair-formatting:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/product-readiness-9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run format:check
      - name: Commit formatting repair
        run: |
          rm -rf diagnostics/ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src diagnostics/ci
          git commit -m "fix(ci): format landing page components"
          git push origin HEAD:improve/product-readiness-9
