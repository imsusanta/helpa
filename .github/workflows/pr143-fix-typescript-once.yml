name: PR 143 one-time TypeScript compatibility fix

on:
  push:
    branches: [fix/pr142-quality-gate]

permissions:
  contents: write

jobs:
  fix-typescript:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore supported TypeScript version
        run: npm install --save-dev typescript@5.9.3
      - name: Commit dependency compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(ci): restore eslint-compatible TypeScript"
          git push
