name: Fix current baseline CI quality

on:
  push:
    branches:
      - fix/ci-quality-current-main-20260828

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-quality-current-main-20260828
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply deterministic test cleanup and lint-safe narrowing
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/app/(dashboard)/trip-proposals/page.tsx')
          text = page.read_text()
          text = text.replace(
              'const trip = proposal.travel_details!;\n                  return (',
              'const trip = proposal.travel_details;\n                  if (!trip) return null;\n                  return ('
          )
          page.write_text(text)

          test = Path('src/tests/core-ai.test.ts')
          text = test.read_text()
          text = text.replace(
              "import { describe, it, expect, beforeEach, vi } from 'vitest';",
              "import { afterEach, beforeEach, describe, expect, it, vi } from 'vitest';"
          )
          marker = "  describe('Dynamic Industry AI Role Resolution', () => {"
          cleanup = """  afterEach(() => {
            setAiProvider(new OpenRouterAiProvider());
            vi.restoreAllMocks();
            delete process.env.OPENROUTER_API_KEY;
            delete process.env.ORCAROUTER_API_KEY;
            delete process.env.CLOUDFLARE_API_TOKEN;
            delete process.env.CLOUDFLARE_ACCOUNT_ID;
          });

"""
          if cleanup not in text:
              text = text.replace(marker, cleanup + marker)
          test.write_text(text)
          PY
          npx prettier --write 'src/app/(dashboard)/trip-proposals/page.tsx' 'src/tests/core-ai.test.ts'
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/app/(dashboard)/trip-proposals/page.tsx' 'src/tests/core-ai.test.ts'
          git diff --cached --quiet || git commit -m 'test: stabilize AI cleanup and trip proposal typing'
          git push
