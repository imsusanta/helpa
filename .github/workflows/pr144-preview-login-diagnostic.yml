name: PR 142 preview login diagnostic

on:
  push:
    branches: [fix/pr142-quality-gate]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose-preview-login:
    runs-on: ubuntu-latest
    env:
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: login
        name: Diagnose preview login without exposing credentials
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          (async () => {
            let pageStatus = 0;
            let loginStatus = 0;
            let loginSuccess = false;
            let reason = 'unclassified login failure';
            try {
              const base = process.env.E2E_BASE_URL.replace(/\/$/, '');
              const loginPage = await fetch(`${base}/login`, {
                redirect: 'follow',
                signal: AbortSignal.timeout(20000),
              });
              pageStatus = loginPage.status;

              const response = await fetch(`${base}/api/auth/login`, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({
                  email: process.env.E2E_TEST_EMAIL,
                  password: process.env.E2E_TEST_PASSWORD,
                }),
                redirect: 'manual',
                signal: AbortSignal.timeout(20000),
              });
              loginStatus = response.status;
              const body = await response.json().catch(() => ({}));
              loginSuccess = Boolean(response.ok && body?.success);

              if (loginSuccess) reason = 'credentials accepted by the login API';
              else if (loginStatus === 401) reason = 'test email or password was rejected';
              else if (loginStatus === 403) reason = 'preview or login request is forbidden';
              else if (loginStatus === 404) reason = 'login API route was not found on this preview';
              else if (loginStatus >= 500) reason = 'preview login API returned a server error';
              else if (loginStatus >= 200 && loginStatus < 300)
                reason = 'login API returned success status without an authenticated session';
            } catch (error) {
              reason = error instanceof Error ? `network failure: ${error.name}` : 'network failure';
            }

            const output = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(output, `page_status=${pageStatus}\n`);
            fs.appendFileSync(output, `login_status=${loginStatus}\n`);
            fs.appendFileSync(output, `login_success=${loginSuccess}\n`);
            fs.appendFileSync(output, `reason=${reason}\n`);
          })();
          NODE
      - name: Publish sanitized login diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_STATUS: ${{ steps.login.outputs.page_status }}
          LOGIN_STATUS: ${{ steps.login.outputs.login_status }}
          LOGIN_SUCCESS: ${{ steps.login.outputs.login_success }}
          REASON: ${{ steps.login.outputs.reason }}
        shell: bash
        run: |
          cat > /tmp/comment.md <<EOF
          ## Preview login diagnosis

          - Login page HTTP status: **${PAGE_STATUS}**
          - Login API HTTP status: **${LOGIN_STATUS}**
          - Login accepted: **${LOGIN_SUCCESS}**
          - Diagnosis: **${REASON}**
          - Browser data verification performed: **no**

          No credential, response body, account ID, or secret value is included in this report.
          EOF
          gh pr comment 144 --body-file /tmp/comment.md
          test "$LOGIN_SUCCESS" = "true"
