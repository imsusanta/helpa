name: Format WhatsApp Config Helper

on:
  push:
    branches:
      - feat/whatsapp-embedded-signup

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/settings/whatsapp-config.tsx
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-whatsapp-config
          path: src/components/settings/whatsapp-config.tsx
