name: PR 143 quality diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-report:
    if: github.event.pull_request.number == 143
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run quality commands and report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          npm run format:check > /tmp/format.log 2>&1
          format_status=$?
          npm run lint > /tmp/lint.log 2>&1
          lint_status=$?
          npm run typecheck > /tmp/typecheck.log 2>&1
          typecheck_status=$?
          {
            echo '## PR 143 quality diagnostics'
            echo
            echo "- format: $format_status"
            echo "- lint: $lint_status"
            echo "- typecheck: $typecheck_status"
            echo
            echo '### Format'
            echo '```text'
            tail -n 200 /tmp/format.log
            echo '```'
            echo '### Lint'
            echo '```text'
            tail -n 200 /tmp/lint.log
            echo '```'
            echo '### Typecheck'
            echo '```text'
            tail -n 200 /tmp/typecheck.log
            echo '```'
          } > /tmp/quality-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/quality-comment.md
          test "$format_status" -eq 0 -a "$lint_status" -eq 0 -a "$typecheck_status" -eq 0
