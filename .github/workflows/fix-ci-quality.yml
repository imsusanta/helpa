name: Fix CI quality branch

on:
  push:
    branches:
      - fix/ci-baseline-ai-tests-20260827

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-baseline-ai-tests-20260827
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repair lint-safe trip proposal code
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/(dashboard)/trip-proposals/page.tsx')
          text = path.read_text()
          text = text.replace('.catch(() => {});', '.catch(() => setContacts([]));')
          text = text.replace('const trip = proposal.travel_details!;\n                  return (', 'const trip = proposal.travel_details;\n                  if (!trip) return null;\n                  return (')
          path.write_text(text)
          PY
          npx prettier --write 'src/app/(dashboard)/trip-proposals/page.tsx'
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/app/(dashboard)/trip-proposals/page.tsx'
          git diff --cached --quiet || git commit -m 'fix: resolve trip proposal quality errors'
          git push
