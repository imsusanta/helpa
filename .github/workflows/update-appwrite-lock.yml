name: Regenerate Appwrite lockfile

on:
  push:
    branches: [fix/missing-appwrite-dependencies]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/missing-appwrite-dependencies
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve dependency lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile update
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): lock Appwrite SDK dependencies"
          git push origin HEAD:fix/missing-appwrite-dependencies
